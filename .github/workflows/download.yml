name: CPI Artifact Download Debug

on:
  workflow_dispatch:
    inputs:
      iflow_id:
        description: "Integration Flow ID"
        required: true
      version:
        description: "Version (or active)"
        required: true
        default: "active"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get Source OAuth Token
        id: source_token
        run: |
          TOKEN=$(curl -s -X POST "${{ secrets.SOURCE_TOKEN_URL }}" \
            -d "grant_type=client_credentials" \
            -u "${{ secrets.SOURCE_CLIENT_ID }}:${{ secrets.SOURCE_CLIENT_SECRET }}" \
            | jq -r .access_token)

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Download Artifact (SAFE QUERY MODE)
        run: |
          ID="${{ github.event.inputs.iflow_id }}"
          VERSION="${{ github.event.inputs.version }}"

          BASE_URL="${{ secrets.SOURCE_API_URL }}/api/v1/IntegrationDesigntimeArtifacts"

          echo "Calling CPI safely..."

          curl -L --fail --silent --show-error \
            -G "$BASE_URL" \
            --data-urlencode "Id=$ID" \
            --data-urlencode "Version=$VERSION" \
            --data-urlencode "\$format=zip" \
            -H "Authorization: Bearer ${{ steps.source_token.outputs.token }}" \
            -o artifact.zip

          file artifact.zip

      - name: Convert to Base64
        run: |
          base64 artifact.zip | tr -d '\n' > artifact.b64

      - name: Show Output
        run: |
          echo "SIZE:"
          wc -c artifact.b64

          echo "PREVIEW:"
          head -c 300 artifact.b64
          echo ""
