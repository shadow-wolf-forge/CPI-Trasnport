name: CPI Artifact Download Debug

on:
  workflow_dispatch:
    inputs:
      iflow_id:
        description: "Integration Flow ID"
        required: true
      version:
        description: "Version (or active)"
        required: true
        default: "active"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Get OAuth Token
        id: token
        run: |
          TOKEN=$(curl -s -X POST "${{ secrets.SOURCE_TOKEN_URL }}" \
            -d "grant_type=client_credentials" \
            -u "${{ secrets.SOURCE_CLIENT_ID }}:${{ secrets.SOURCE_CLIENT_SECRET }}" \
            | jq -r .access_token)

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Download CPI Artifact
        run: |
          URL="${{ secrets.SOURCE_API_URL }}/api/v1/IntegrationDesigntimeArtifacts(Id='${{ github.event.inputs.iflow_id }}',Version='${{ github.event.inputs.version }}')/$value"

          echo "DOWNLOAD URL:"
          echo "$URL"

          curl -L --fail \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -o artifact.zip \
            "$URL"

          echo "FILE TYPE CHECK:"
          file artifact.zip

      - name: Convert to Base64
        run: |
          base64 artifact.zip | tr -d '\n' > artifact.b64

      - name: Show Base64 Preview
        run: |
          echo "BASE64 LENGTH:"
          wc -c artifact.b64

          echo "BASE64 SAMPLE:"
          head -c 300 artifact.b64
          echo ""```
