name: CPI Artifact Download Debug

on:
  workflow_dispatch:
    inputs:
      iflow_id:
        description: "Integration Flow ID"
        required: true
      version:
        description: "Version (or active)"
        required: true
        default: "active"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get Source OAuth Token
        id: source_token
        run: |
          TOKEN=$(curl -s -X POST "${{ secrets.SOURCE_TOKEN_URL }}" \
            -d "grant_type=client_credentials" \
            -u "${{ secrets.SOURCE_CLIENT_ID }}:${{ secrets.SOURCE_CLIENT_SECRET }}" \
            | jq -r .access_token)

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Build CPI URL
        id: build_url
        run: |
          ID="${{ github.event.inputs.iflow_id }}"
          VERSION="${{ github.event.inputs.version }}"

          URL="${{ secrets.SOURCE_API_URL }}/api/v1/IntegrationDesigntimeArtifacts(Id='${ID}',Version='${VERSION}')/\$value"

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download Artifact (RAW DEBUG MODE)
        run: |
          echo "FINAL URL:"
          echo "${{ steps.build_url.outputs.url }}"

          curl -v -L \
            -H "Authorization: Bearer ${{ steps.source_token.outputs.token }}" \
            -o artifact.zip \
            "${{ steps.build_url.outputs.url }}"

          echo "FILE CHECK:"
          file artifact.zip

      - name: Convert to Base64
        run: |
          base64 artifact.zip | tr -d '\n' > artifact.b64

      - name: Show Base64 Output
        run: |
          echo "SIZE:"
          wc -c artifact.b64

          echo "PREVIEW:"
          head -c 300 artifact.b64
          echo ""
