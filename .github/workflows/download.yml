name: CPI Artifact Download Debug (Hard Token Debug)

on:
  workflow_dispatch:
    inputs:
      iflow_id:
        description: "Integration Flow ID"
        required: true
      version:
        description: "Version (or active)"
        required: true
        default: "active"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get OAuth Token (FULL DEBUG)
        id: source_token
        run: |
          echo "=== CALLING TOKEN ENDPOINT ==="

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.SOURCE_TOKEN_URL }}" \
            -d "grant_type=client_credentials" \
            -u "${{ secrets.SOURCE_CLIENT_ID }}:${{ secrets.SOURCE_CLIENT_SECRET }}")

          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          echo "=== TOKEN RESPONSE BODY ==="
          echo "$BODY"

          echo "=== HTTP STATUS ==="
          echo "$STATUS"

          TOKEN=$(echo "$BODY" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ TOKEN FETCH FAILED"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

          echo "=== TOKEN STORED (masked) ==="
          echo "${TOKEN:0:20}...${TOKEN: -20}"

      - name: Build CPI URL
        id: build_url
        run: |
          ID="${{ github.event.inputs.iflow_id }}"
          VERSION="${{ github.event.inputs.version }}"

          URL="https://f2187e55trial.it-cpitrial06.cfapps.us10-001.hana.ondemand.com:443/api/v1/IntegrationDesigntimeArtifacts(Id='${ID}',Version='${VERSION}')/Content"

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download Artifact
        run: |
          curl -v --location \
            -H "Authorization: Bearer ${{ steps.source_token.outputs.token }}" \
            -o artifact.zip \
            "${{ steps.build_url.outputs.url }}"

          file artifact.zip

      - name: Convert to Base64
        run: |
          base64 artifact.zip | tr -d '\n' > artifact.b64

      - name: Show Output
        run: |
          wc -c artifact.b64
          head -c 300 artifact.b64
          echo ""
