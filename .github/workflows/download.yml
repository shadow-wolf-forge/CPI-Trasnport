      - name: Download CPI Artifact
        run: |
          ID="${{ github.event.inputs.iflow_id }}"
          VERSION="${{ github.event.inputs.version }}"

          RAW_URL="${{ secrets.SOURCE_API_URL }}/api/v1/IntegrationDesigntimeArtifacts(Id='$ID',Version='$VERSION')/\$value"

          ENCODED_URL=$(python3 - <<EOF
import urllib.parse
print(urllib.parse.quote("""$RAW_URL""", safe=":/?=&()$,'"))
EOF
)

          echo "ENCODED URL:"
          echo "$ENCODED_URL"

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -o artifact.zip \
            "$ENCODED_URL"

          file artifact.zip
