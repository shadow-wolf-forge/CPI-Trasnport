name: CPI Artifact Download (Correct $value + Working OAuth)

on:
  workflow_dispatch:
    inputs:
      iflow_id:
        description: "Integration Flow ID"
        required: true
      version:
        description: "Version"
        required: true
        default: "active"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Get OAuth Token (Working Basic Auth)
        id: token_step
        run: |
          RESPONSE=$(curl -s \
            "https://f2187e55trial.authentication.us10.hana.ondemand.com/oauth/token?grant_type=client_credentials" \
            --header "Authorization: ${{ secrets.SRC_TOKEN_BASIC }}")

          echo "=== TOKEN RESPONSE ==="
          echo "$RESPONSE"

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "TOKEN FETCH FAILED"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

          echo "=== TOKEN EXTRACTED ==="
          echo "${TOKEN:0:20}...${TOKEN: -20}"

      - name: Build CPI URL ($value)
        id: build_url
        run: |
          ID="${{ github.event.inputs.iflow_id }}"
          VERSION="${{ github.event.inputs.version }}"

          URL="https://f2187e55trial.it-cpitrial06.cfapps.us10-001.hana.ondemand.com/api/v1/IntegrationDesigntimeArtifacts(Id='${ID}',Version='${VERSION}')/\$value"

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Debug URL
        run: |
          echo "FINAL CPI URL:"
          echo "${{ steps.build_url.outputs.url }}"

      - name: Download Artifact (CPI)
        run: |
          curl --location --fail --silent --show-error \
            -H "Authorization: Bearer ${{ steps.token_step.outputs.token }}" \
            -o artifact.zip \
            "${{ steps.build_url.outputs.url }}"

          file artifact.zip

      - name: Convert to Base64
        run: |
          base64 artifact.zip | tr -d '\n' > artifact.b64

      - name: Show Base64 Output
        run: |
          echo "SIZE:"
          wc -c artifact.b64

          echo "PREVIEW:"
          head -c 300 artifact.b64
          echo ""
