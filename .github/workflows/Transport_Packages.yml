name: Transport Integration Package

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Package ID"
        required: true

permissions:
  contents: write

jobs:
  transport_package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get Source Token
        id: source_token
        run: |
          RESPONSE=$(curl -s \
            "${{ secrets.SRC_TOKEN_URL }}" \
            --header "Authorization: ${{ secrets.SRC_TOKEN_BASIC }}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "SOURCE TOKEN FAILED"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Download Package
        run: |
          URL="${{ secrets.SOURCE_API_URL }}/api/v1/IntegrationPackages('${{ github.event.inputs.package_id }}')/\$value"

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${{ steps.source_token.outputs.token }}" \
            -o package.zip \
            "$URL"

      - name: Convert ZIP → Base64
        run: |
          base64 package.zip | tr -d '\n' > package.b64

      - name: Get Target Token
        id: target_token
        run: |
          RESPONSE=$(curl -s \
            "${{ secrets.TGT_TOKEN_URL }}" \
            --header "Authorization: ${{ secrets.TGT_TOKEN_BASIC }}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "TARGET TOKEN FAILED"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Fetch CSRF
        id: csrf
        run: |
          curl -s -D headers.txt -o /dev/null \
            -X GET "${{ secrets.TARGET_API_URL }}/api/v1/IntegrationPackages" \
            -H "Authorization: Bearer ${{ steps.target_token.outputs.token }}" \
            -H "X-CSRF-Token: Fetch"

          echo "token=$(grep -i x-csrf-token headers.txt | awk '{print $2}' | tr -d '\r')" >> $GITHUB_OUTPUT
          echo "cookie=$(grep -i set-cookie headers.txt | awk '{print $2}' | tr -d '\r')" >> $GITHUB_OUTPUT

      - name: Build Payload
        run: |
          PACKAGE_B64=$(cat package.b64)

          cat <<EOF > payload.json
          {
            "PackageContent": "$PACKAGE_B64"
          }
          EOF

      - name: Upload Package (Always POST with overwrite)
        run: |
          curl -X POST \
            "${{ secrets.TARGET_API_URL }}/api/v1/IntegrationPackages?overwrite=true" \
            -H "Authorization: Bearer ${{ steps.target_token.outputs.token }}" \
            -H "X-CSRF-Token: ${{ steps.csrf.outputs.token }}" \
            -H "Cookie: ${{ steps.csrf.outputs.cookie }}" \
            -H "Content-Type: application/json" \
            --data @payload.json
