name: CPI Token Debug (Hardcoded Test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token_test:
    runs-on: ubuntu-latest

    steps:
      - name: Get OAuth Token (HARDCODED TEST)
        run: |
          echo "=== CALLING TOKEN ENDPOINT ==="

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://f2187e55trial.authentication.us10.hana.ondemand.com/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "sb-a9097239-39ba-4f96-adf3-f2fb50c4a9f5!b595541|it!b55215:96ad8725-0848-4415-97b7-336d3193bdb0$KNpHFeTo_jN-8sbSxrFw2Bg1fG9UtLuCeD3nZbsGqwI=" \
            -d "grant_type=client_credentials")

          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          echo "=== HTTP STATUS ==="
          echo "$STATUS"

          echo "=== RESPONSE BODY ==="
          echo "$BODY"

          echo "=== EXTRACT TOKEN ==="
          TOKEN=$(echo "$BODY" | jq -r '.access_token // empty')

          echo "TOKEN:"
          echo "$TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "❌ TOKEN NOT GENERATED"
            exit 1
          fi
