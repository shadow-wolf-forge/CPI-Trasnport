name: CPI Token Test (Working Curl Style)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token_test:
    runs-on: ubuntu-latest

    steps:
      - name: Get OAuth Token (MATCHING WORKING CURL)
        run: |
          echo "=== CALLING TOKEN ENDPOINT ==="

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --location \
            "https://f2187e55trial.authentication.us10.hana.ondemand.com/oauth/token?grant_type=client_credentials" \
            --header "Authorization: Basic c2ItYTkwOTcyMzktMzliYS00Zjk2LWFkZjMtZjJmYjUwYzRhOWY1IWI1OTU1NDF8aXQhYjU1MjE1Ojk2YWQ4NzI1LTA4NDgtNDQxNS05N2I3LTMzNmQzMTkzYmRiMCRLTnBIRmVUb19qTi04c2JTeHJGdzJCZzFmRzlVdEx1Q2VEM25aYnNHcXdJPQ==" \
            --header "Cookie: dtCookie=v_4_srv_28_sn_D8F455C505DA30B4400EB802C2EE6B27_perc_100000_ol_0_mul_1_app-3Aea7c4b59f27d43eb_1")

          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          echo "=== HTTP STATUS ==="
          echo "$STATUS"

          echo "=== RESPONSE BODY ==="
          echo "$BODY"

          TOKEN=$(echo "$BODY" | jq -r '.access_token // empty')

          echo "=== TOKEN ==="
          echo "$TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "❌ TOKEN FETCH FAILED"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT
