name: CPI Transport + Backup

on:
  workflow_dispatch:
    inputs:
      iflow_id:
        description: "Integration Flow ID"
        required: true
      version:
        description: "Version (or active)"
        required: true
        default: "active"
      package_id:
        description: "Package ID"
        required: true

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Source OAuth Token
        id: source_token
        run: |
          TOKEN=$(curl -s -X POST "${{ secrets.SOURCE_TOKEN_URL }}" \
            -d "grant_type=client_credentials" \
            -u "${{ secrets.SOURCE_CLIENT_ID }}:${{ secrets.SOURCE_CLIENT_SECRET }}" \
            | jq -r .access_token)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Download iFlow ZIP (RESTORED + SAFE TRACE)
        run: |
          URL="${{ secrets.SOURCE_API_URL }}/api/v1/IntegrationDesigntimeArtifacts(Id='${{ github.event.inputs.iflow_id }}',Version='${{ github.event.inputs.version }}')/\$value"

          echo "===== REQUEST URL ====="
          echo "$URL"

          echo "===== RESPONSE TRACE START ====="

          # SAFE DOWNLOAD (restored working version)
          curl -L \
            -H "Authorization: Bearer ${{ steps.source_token.outputs.token }}" \
            -D headers.txt \
            -o artifact.zip \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "$URL"

          echo "===== HEADERS ====="
          cat headers.txt

          echo "===== FILE TYPE CHECK ====="
          file artifact.zip

          echo "===== SAMPLE BYTES ====="
          head -c 200 artifact.zip | xxd

          echo "===== RESPONSE TRACE END ====="

      - name: Save into repo
        run: |
          mkdir -p artifacts/${{ github.event.inputs.iflow_id }}
          cp artifact.zip artifacts/${{ github.event.inputs.iflow_id }}/artifact_$(date +%s).zip

      - name: Commit to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Backup ${{ github.event.inputs.iflow_id }} - $(date)"
          git pull --rebase origin main
          git push origin main

      - name: Get Target OAuth Token
        id: target_token
        run: |
          TOKEN=$(curl -s -X POST "${{ secrets.TARGET_TOKEN_URL }}" \
            -d "grant_type=client_credentials" \
            -u "${{ secrets.TARGET_CLIENT_ID }}:${{ secrets.TARGET_CLIENT_SECRET }}" \
            | jq -r .access_token)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Fetch CSRF
        id: csrf
        run: |
          curl -s -D headers.txt -o /dev/null \
            -X GET "${{ secrets.TARGET_API_URL }}/api/v1/IntegrationDesigntimeArtifacts" \
            -H "Authorization: Bearer ${{ steps.target_token.outputs.token }}" \
            -H "X-CSRF-Token: Fetch"

          echo "token=$(grep -i x-csrf-token headers.txt | awk '{print $2}' | tr -d '\r')" >> $GITHUB_OUTPUT
          echo "cookie=$(grep -i set-cookie headers.txt | awk '{print $2}' | tr -d '\r')" >> $GITHUB_OUTPUT

      - name: Convert ZIP → Base64
        id: encode
        run: |
          BASE64_CONTENT=$(base64 artifact.zip | tr -d '\n')

          echo "===== FULL BASE64 OUTPUT START ====="
          echo "$BASE64_CONTENT"
          echo "===== FULL BASE64 OUTPUT END ====="

          echo "content=$BASE64_CONTENT" >> $GITHUB_OUTPUT

      - name: Build Payload
        run: |
          cat <<EOF > payload.json
          {
            "Name": "${{ github.event.inputs.iflow_id }}",
            "Id": "${{ github.event.inputs.iflow_id }}",
            "PackageId": "${{ github.event.inputs.package_id }}",
            "ArtifactContent": "${{ steps.encode.outputs.content }}"
          }
          EOF

      - name: Upload iFlow (PUT Base64 JSON)
        run: |
          curl -v -X PUT \
            "${{ secrets.TARGET_API_URL }}/api/v1/IntegrationDesigntimeArtifacts(Id='${{ github.event.inputs.iflow_id }}',Version='active')" \
            -H "Authorization: Bearer ${{ steps.target_token.outputs.token }}" \
            -H "X-CSRF-Token: ${{ steps.csrf.outputs.token }}" \
            -H "Cookie: ${{ steps.csrf.outputs.cookie }}" \
            -H "Content-Type: application/json" \
            --data @payload.json
