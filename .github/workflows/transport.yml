name: CPI Transport + Backup

on:
  workflow_dispatch:
    inputs:
      iflow_id:
        description: "Integration Flow ID"
        required: true
      version:
        description: "Version (or active)"
        required: true
        default: "active"
      package_id:
        description: "Package ID"
        required: true

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get Source OAuth Token (WORKING METHOD)
        id: source_token
        run: |
          RESPONSE=$(curl -s \
            "${{ secrets.SOURCE_TOKEN_URL }}?grant_type=client_credentials" \
            --header "Authorization: ${{ secrets.SRC_TOKEN_BASIC }}")

          echo "=== SOURCE TOKEN RESPONSE ==="
          echo "$RESPONSE"

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "SOURCE TOKEN FETCH FAILED"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

          echo "=== SOURCE TOKEN EXTRACTED ==="
          echo "${TOKEN:0:20}...${TOKEN: -20}"

      - name: Download iFlow ZIP (VALID CPI BINARY)
        run: |
          URL="${{ secrets.SOURCE_API_URL }}/api/v1/IntegrationDesigntimeArtifacts(Id='${{ github.event.inputs.iflow_id }}',Version='${{ github.event.inputs.version }}')/\$value"

          echo "===== DOWNLOAD URL ====="
          echo "$URL"

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${{ steps.source_token.outputs.token }}" \
            -o artifact.zip \
            "$URL"

          echo "===== FILE VALIDATION ====="
          file artifact.zip

      - name: Save backup
        run: |
          mkdir -p artifacts/${{ github.event.inputs.iflow_id }}
          cp artifact.zip artifacts/${{ github.event.inputs.iflow_id }}/artifact_$(date +%s).zip

      - name: Commit to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Backup ${{ github.event.inputs.iflow_id }} - $(date)"
          git pull --rebase origin main
          git push origin main

      - name: Get Target OAuth Token (WORKING METHOD)
        id: target_token
        run: |
          RESPONSE=$(curl -s \
            "${{ secrets.TGT_TOKEN_URL }}?grant_type=client_credentials" \
            --header "Authorization: ${{ secrets.TGT_TOKEN_BASIC }}")

          echo "=== TARGET TOKEN RESPONSE ==="
          echo "$RESPONSE"

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "TARGET TOKEN FETCH FAILED"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

          echo "=== TARGET TOKEN EXTRACTED ==="
          echo "${TOKEN:0:20}...${TOKEN: -20}"

      - name: Fetch CSRF
        id: csrf
        run: |
          curl -s -D headers.txt -o /dev/null \
            -X GET "${{ secrets.TARGET_API_URL }}/api/v1/IntegrationDesigntimeArtifacts" \
            -H "Authorization: Bearer ${{ steps.target_token.outputs.token }}" \
            -H "X-CSRF-Token: Fetch"

          echo "token=$(grep -i x-csrf-token headers.txt | awk '{print $2}' | tr -d '\r')" >> $GITHUB_OUTPUT
          echo "cookie=$(grep -i set-cookie headers.txt | awk '{print $2}' | tr -d '\r')" >> $GITHUB_OUTPUT

      - name: Convert ZIP → Base64 (SAFE FILE MODE)
        run: |
          base64 artifact.zip | tr -d '\n' > artifact.b64

          echo "===== BASE64 PREVIEW ====="
          head -c 200 artifact.b64
          echo ""

      - name: Build Payload
        run: |
          ARTIFACT_B64=$(cat artifact.b64)

          cat <<EOF > payload.json
          {
            "Name": "${{ github.event.inputs.iflow_id }}",
            "Id": "${{ github.event.inputs.iflow_id }}",
            "PackageId": "${{ github.event.inputs.package_id }}",
            "ArtifactContent": "$ARTIFACT_B64"
          }
          EOF

          echo "===== PAYLOAD READY ====="
          ls -lh payload.json

      - name: Upload iFlow (PUT Base64 JSON)
        run: |
          curl -v -X PUT \
            "${{ secrets.TARGET_API_URL }}/api/v1/IntegrationDesigntimeArtifacts(Id='${{ github.event.inputs.iflow_id }}',Version='active')" \
            -H "Authorization: Bearer ${{ steps.target_token.outputs.token }}" \
            -H "X-CSRF-Token: ${{ steps.csrf.outputs.token }}" \
            -H "Cookie: ${{ steps.csrf.outputs.cookie }}" \
            -H "Content-Type: application/json" \
            --data @payload.json
