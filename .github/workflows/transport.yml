      - name: Upload iFlow (Base64 JSON - FIXED)
        run: |
          # Encode ZIP (no line breaks)
          base64 -w 0 artifact.zip > artifact.b64

          # Create payload JSON
          jq -n \
            --arg name "${{ github.event.inputs.iflow_id }}" \
            --arg id "${{ github.event.inputs.iflow_id }}" \
            --arg package "${{ github.event.inputs.package_id }}" \
            --rawfile content artifact.b64 \
            '{
              Name: $name,
              Id: $id,
              PackageId: $package,
              ArtifactContent: $content
            }' > payload.json

          # Fetch CSRF token + cookie
          RESPONSE=$(curl -s -D headers.txt -o /dev/null \
            -X GET "${{ secrets.TARGET_API_URL }}/api/v1/IntegrationFlows" \
            -H "Authorization: Bearer ${{ steps.target_token.outputs.token }}" \
            -H "X-CSRF-Token: Fetch")

          TOKEN=$(grep -i x-csrf-token headers.txt | awk '{print $2}' | tr -d '\r')
          COOKIE=$(grep -i set-cookie headers.txt | cut -d' ' -f2 | tr -d '\r')

          # POST with required headers
          curl -f -X POST "${{ secrets.TARGET_API_URL }}/api/v1/IntegrationFlows" \
            -H "Authorization: Bearer ${{ steps.target_token.outputs.token }}" \
            -H "X-CSRF-Token: $TOKEN" \
            -H "Cookie: $COOKIE" \
            -H "Content-Type: application/json" \
            --data @payload.json
